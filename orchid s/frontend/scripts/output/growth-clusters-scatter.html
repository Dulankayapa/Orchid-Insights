<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plant Growth Clusters</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; color: #0f172a; }
      h1 { margin: 0 0 8px; }
      p { margin: 0 0 14px; color: #475569; }
      .card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; max-width: 980px; }
      canvas { width: 100%; max-width: 940px; height: 520px; }
    </style>
  </head>
  <body>
    <h1>Plant Growth Clusters (K-Means, k=3)</h1>
    <p>X-axis: days since planting, Y-axis: latest height (cm), color: growth pattern cluster</p>
    <div class="card"><canvas id="clusterChart"></canvas></div>
    <script>
      const datasets = [{"label":"slow growth","data":[{"x":21,"y":2.2,"jar_id":"Jar-92","growth_rate":0.00952},{"x":21,"y":2.5,"jar_id":"Jar-97","growth_rate":0.02857}],"backgroundColor":"rgba(239, 68, 68, 0.85)","pointRadius":5},{"label":"normal growth","data":[{"x":21,"y":2.9,"jar_id":"Jar-91","growth_rate":0.05238},{"x":21,"y":3.6,"jar_id":"Jar-94","growth_rate":0.05714},{"x":21,"y":4.2,"jar_id":"Jar-95","growth_rate":0.04762},{"x":21,"y":3.1,"jar_id":"Jar-96","growth_rate":0.06667}],"backgroundColor":"rgba(59, 130, 246, 0.85)","pointRadius":5},{"label":"fast growth","data":[{"x":21,"y":4.9,"jar_id":"Jar-93","growth_rate":0.19524}],"backgroundColor":"rgba(16, 185, 129, 0.85)","pointRadius":5}];
      const ctx = document.getElementById('clusterChart');
      new Chart(ctx, {
        type: 'scatter',
        data: { datasets },
        options: {
          responsive: true,
          plugins: {
            legend: { position: 'top' },
            tooltip: {
              callbacks: {
                label(context) {
                  const raw = context.raw || {};
                  const parts = [
                    raw.jar_id ? 'Jar: ' + raw.jar_id : null,
                    Number.isFinite(raw.x) ? 'Days: ' + raw.x : null,
                    Number.isFinite(raw.y) ? 'Height: ' + raw.y.toFixed(2) + ' cm' : null,
                    Number.isFinite(raw.growth_rate) ? 'Rate: ' + raw.growth_rate.toFixed(3) + ' cm/day' : null,
                  ].filter(Boolean);
                  return parts.join(' | ');
                }
              }
            }
          },
          scales: {
            x: { title: { display: true, text: 'Days Since Planting' } },
            y: { title: { display: true, text: 'Height (cm)' } }
          }
        }
      });
    </script>
  </body>
</html>
